[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uni-judge-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastembed>=0.7.1",
	"numpy>=1.26.0",
	"openai>=1.58.0",
	"pandas>=2.2.0",
	"pyarrow>=16.0.0",
	"pydantic>=2.8.0",
	"pyyaml>=6.0.2",
	"python-dotenv>=1.0.1",
	"scikit-learn>=1.5.0",
	"datasets>=2.20.0",
	"sentence-transformers>=5.4.1",
	"transformers<5",
	"setfit>=1.1.3",
	"umap-learn>=0.5.6",
	"xgboost>=2.0.0",
	"google-genai>=1.74.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
	"llm: live tests that hit external LLM providers (requires RUN_LLM_TESTS=1 and API keys)",
]
