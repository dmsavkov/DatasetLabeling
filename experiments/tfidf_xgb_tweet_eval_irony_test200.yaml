name: tfidf_xgb_tweet_eval_irony_test200
seed: 42
train_data: data/processed/tweet_eval_irony/train_seed/tier_100/samples.parquet
test_data: data/processed/tweet_eval_irony/test/tier_200/samples.parquet
output_dir: results/extended/tfidf_xgb_tweet_eval_irony_test200
model:
  kind: tfidf_xgb
  params:
    min_df: 1.0
    max_df: 1.0
    max_features: 200000
    ngram_range:
    - 1
    - 2
    n_estimators: 300
    learning_rate: 0.1
    max_depth: 3
